:root{
  --f:'Noto Kufi Arabic',Tahoma,'Segoe UI',Arial,sans-serif;
  --bg:#000000; --page:#0A0D0E; --bar:#1E2121; --bar-ink:#FFFFFF; --circle:#3B4242; --circle-ink:#FFFFFF;
  --card:#131718; --card-2:#1A1F20; --field:#1E2121; --line:#2B3232; --line-2:#202626;
  --ink:#FFFFFF; --ink-2:#E2E6E6; --muted:#98A3A3;
  --red:#EB2027; --red-d:#C9161C; --red-t:rgba(235,32,39,.14);
  --tech:#3D8FE0; --tech-t:rgba(61,143,224,.17); --soft:#F2A23A; --soft-t:rgba(242,162,58,.17); --mgr:#A57BDB; --mgr-t:rgba(165,123,219,.19);
  --ok:#3DBE7A; --ok-t:rgba(61,190,122,.15); --warn:#F2A23A; --warn-t:rgba(242,162,58,.15); --danger:#FF5A5F; --danger-t:rgba(255,90,95,.14);
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --hero:radial-gradient(ellipse at 22% 45%,#0F1A24 0%,#05080B 45%,#000 75%);
}
[data-theme="light"]{
  --bg:#FFFFFF; --page:#F3F4F4; --bar:#FFFFFF; --bar-ink:#1E2121; --circle:#E3E7E7; --circle-ink:#1E2121;
  --card:#FFFFFF; --card-2:#F7F8F8; --field:#FFFFFF; --line:#DFE3E3; --line-2:#EDF0F0;
  --ink:#141818; --ink-2:#2A3030; --muted:#66706F;
  --red-t:rgba(235,32,39,.08);
  --tech:#1F64B5; --tech-t:#E4EEF9; --soft:#C97A10; --soft-t:#FDF1DF; --mgr:#6B47A3; --mgr-t:#EFE9F8;
  --ok:#1F8A4C; --ok-t:#E3F4EA; --warn:#A66300; --warn-t:#FFF2DB; --danger:#C9161C; --danger-t:#FCE8E8;
  --shadow:0 8px 24px rgba(20,24,24,.1);
  --hero:radial-gradient(ellipse at 22% 45%,#25303A 0%,#101518 50%,#000 80%);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--f);background:var(--page);color:var(--ink);font-size:14.5px;line-height:1.8;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.in{max-width:1760px;margin:0 auto;padding:0 32px}
bdi{unicode-bidi:isolate}

/* ===== Header (almentor style) ===== */
.hdr{background:var(--bar);color:var(--bar-ink);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line-2)}
.hdr .in{display:flex;align-items:center;gap:22px;height:66px}
.logo{display:flex;align-items:center;cursor:pointer;flex:none;text-decoration:none;color:var(--bar-ink)}
.logo img{max-height:42px;max-width:170px;display:block}
.logo-txt{font-weight:700;font-size:24px;letter-spacing:-.3px;line-height:1;position:relative;white-space:nowrap}
.logo-txt span{position:relative}
.logo-txt span::before{content:'';position:absolute;top:-5px;inset-inline:0;height:3px;background:var(--red);border-radius:2px}
.nav{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:0;color:var(--bar-ink);padding:8px 12px;cursor:pointer;font-size:14.5px;font-weight:500;white-space:nowrap;position:relative;opacity:.9}
.nav button:hover{opacity:1;color:var(--red)}
.nav button.on{opacity:1;font-weight:700}
.nav button.on::after{content:'';position:absolute;bottom:-14px;inset-inline:12px;height:3px;background:var(--red);border-radius:2px 2px 0 0}
.nav .cnt{font-size:11px;background:var(--circle);color:var(--circle-ink);border-radius:10px;padding:0 7px;margin-inline-start:6px;font-weight:600}
.btn-out{background:transparent;border:1px solid var(--bar-ink);color:var(--bar-ink);border-radius:4px;padding:4px 16px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn-out:hover{background:var(--bar-ink);color:var(--bar)}
.hdr-end{display:flex;align-items:center;gap:12px;flex:none}
.ico{background:none;border:0;color:var(--bar-ink);cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.ico svg{width:20px;height:20px;fill:currentColor}
.vsep{width:1px;height:32px;background:var(--circle)}
.circ{width:40px;height:40px;border-radius:50%;background:var(--circle);color:var(--circle-ink);border:0;cursor:pointer;display:grid;place-items:center;font-weight:700;font-size:15px;font-family:var(--f)}
.circ:hover{filter:brightness(1.2)}
.circ svg{width:22px;height:22px}
.ulink{background:none;border:0;color:var(--bar-ink);text-decoration:underline;text-underline-offset:5px;cursor:pointer;font-size:14.5px;white-space:nowrap}
.btn-red{background:var(--red);color:#fff;border:0;border-radius:4px;padding:8px 22px;cursor:pointer;font-weight:600;font-size:14.5px;white-space:nowrap}
.btn-red:hover{background:var(--red-d)}
.sbox{display:none;background:var(--bar);border-top:1px solid var(--line-2);padding:10px 0}
.sbox.show{display:block}
.sbox form{display:flex;gap:8px}
.sbox input{flex:1;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:9px 14px;color:var(--ink)}

/* ===== Hero ===== */
.hero{background:var(--hero);color:#fff;min-height:430px;display:flex;align-items:center;padding:36px 0}
.hero .in{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;width:100%}
.hero h1{margin:0;font-size:40px;font-weight:600;line-height:1.45;max-width:15em}
.hero p{margin:22px 0 30px;font-size:20px;line-height:1.75;color:#E2E6E6;max-width:30em}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn-red{font-size:17px;padding:11px 26px}
.hero .btn-out{border-color:#fff;color:#fff;font-size:15px;padding:10px 20px}
.hero .btn-out:hover{background:#fff;color:#000}
.hcard{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:22px 24px;backdrop-filter:blur(4px)}
.hcard h3{margin:0 0 4px;font-size:18px;font-weight:600}
.hcard .sub{color:#AEB8B8;font-size:13px;margin-bottom:14px}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
.hrow:last-of-type{border-bottom:0}
.hrow b{font-size:20px;font-weight:700}
.hrow.alert b{color:#FF6B70}
.htg{display:flex;gap:6px;margin:4px 0 12px}
.htg span{flex:1;text-align:center;font-size:12.5px;font-weight:600;padding:5px 0;border-radius:4px;color:#fff}
.htg .T{background:#2F79C6}.htg .S{background:#D88A21}.htg .M{background:#8A5FC4}

/* ===== Page band ===== */
.pband{background:var(--hero);color:#fff;padding:38px 0 32px}
.pband .in{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.pband h1{margin:0;font-size:32px;font-weight:600;line-height:1.4}
.pband p{margin:10px 0 0;color:#CDD4D4;font-size:15.5px;max-width:62em;line-height:1.8}
.pband .acts{display:flex;gap:10px;flex-wrap:wrap}
.pband .btn-out{border-color:#fff;color:#fff}
.pband .btn-out:hover{background:#fff;color:#000}
.page{max-width:1760px;margin:0 auto;padding:26px 32px 10px}

/* ===== Buttons (content) ===== */
.btn{background:var(--red);color:#fff;border:1px solid var(--red);border-radius:4px;padding:8px 18px;cursor:pointer;font-weight:600;white-space:nowrap;font-size:14px}
.btn:hover{background:var(--red-d);border-color:var(--red-d)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:4px 12px;font-size:13px}

/* ===== Panels ===== */
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px 24px;margin-bottom:18px}
.panel h3{margin:0;font-size:18px;font-weight:600}
.panel .hint{margin:6px 0 16px;color:var(--muted);font-size:13.5px;line-height:1.8}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.cols>.panel{margin-bottom:0}
.sec{margin:34px 0 16px}
.sec h2{margin:0;font-size:24px;font-weight:600}
.sec p{margin:6px 0 0;color:var(--muted);font-size:14px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-size:30px;font-weight:700;line-height:1.2}
.kpi span{font-size:13px;color:var(--muted);line-height:1.6}
.kpi.alert b{color:var(--danger)}

/* Meter */
.meter{display:flex;flex-direction:column;gap:10px}
.meter-row{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:12px}
.meter-lbl{font-size:13px;color:var(--muted)}
.bar{display:flex;height:36px;overflow:hidden;background:var(--line-2);border-radius:4px}
.bar.target{height:12px;opacity:.5}
.bar.target .seg{font-size:0}
.seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden}
.seg-T{background:var(--tech)} .seg-S{background:var(--soft)} .seg-M{background:var(--mgr)}
.meter-legend{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:8px}
.lg{border-top:3px solid;padding-top:10px}
.lg.T{border-color:var(--tech)} .lg.S{border-color:var(--soft)} .lg.M{border-color:var(--mgr)}
.lg .nm{font-weight:600}
.lg .en{color:var(--muted);font-size:12px;margin-inline-start:6px}
.lg .num{display:block;font-size:30px;font-weight:700;line-height:1.35}
.dev{font-size:12.5px}
.dev.ok{color:var(--ok)} .dev.over{color:var(--warn)} .dev.under{color:var(--danger)}
.basis{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.basis button{border:0;background:transparent;padding:6px 14px;cursor:pointer;font-size:13px;color:var(--muted)}
.basis button.on{background:var(--red);color:#fff;font-weight:600}

/* chips */
.chip{display:inline-block;padding:1px 11px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.T{background:var(--tech-t);color:var(--tech)} .chip.S{background:var(--soft-t);color:var(--soft)} .chip.M{background:var(--mgr-t);color:var(--mgr)}
.flag{display:inline-block;padding:2px 10px;border-radius:4px;font-size:12.5px;font-weight:600;white-space:nowrap}
.flag.ok{background:var(--ok-t);color:var(--ok)} .flag.bad{background:var(--danger-t);color:var(--danger)} .flag.warn{background:var(--warn-t);color:var(--warn)} .flag.na{background:var(--line-2);color:var(--muted)}
.score{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.score i{width:8px;height:8px;border-radius:50%}
.score.h i{background:var(--red)} .score.m i{background:var(--soft)} .score.l i{background:var(--muted)}
.score small{font-weight:400;color:var(--muted)}
.warn-t{color:var(--danger);font-size:13px}
.sim{display:inline-block;margin-top:4px;font-size:12px;color:var(--warn);background:var(--warn-t);padding:0 8px;border-radius:4px}
.cd{direction:ltr;unicode-bidi:isolate;white-space:nowrap}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13.5px}
th,td{padding:12px;text-align:start;border-bottom:1px solid var(--line-2);vertical-align:middle}
th{background:var(--bar);color:var(--bar-ink);font-size:12.5px;font-weight:600;white-space:nowrap}
[data-theme="light"] th{background:#1E2121;color:#fff}
tbody tr:hover{background:var(--card-2)}
tr.sel{background:var(--red-t)!important}
td.num,th.num{text-align:end}
td .sub{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.6}
td.ttl{min-width:230px}
td.ttl b{font-weight:600}
td.dp{min-width:130px}
td.obj{max-width:210px;font-size:13px}
td.act{white-space:nowrap;text-align:center}
td.act button{border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--ink);padding:3px 10px;margin:2px;font-size:12.5px;cursor:pointer}
td.act button:hover{border-color:var(--ink)}
td.act button.del{color:var(--danger);border-color:var(--danger-t)}
td.act button.del:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
tr.qrow td{background:var(--card-2)!important;font-weight:700}
tr.total td{background:var(--red)!important;color:#fff;font-weight:700}
select.st{padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:var(--field);font-size:13px;min-width:118px}
a.lnk{color:var(--red);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-weight:600}
.mini{display:flex;height:10px;overflow:hidden;background:var(--line-2);min-width:120px;border-radius:2px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.filters input,.filters select{padding:8px 12px;border:1px solid var(--line);border-radius:4px;background:var(--field)}
.filters.fgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.filters.fgrid>input[type=search]{grid-column:span 2;min-width:0}
.filters.fgrid>select:nth-of-type(5){grid-column:span 2}
.filters.fgrid select,.filters.fgrid input{width:100%}
.bulk{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--red);color:#fff;padding:10px 16px;margin-bottom:14px;border-radius:8px}
.bulk select{padding:5px 8px;border-radius:4px;border:0;background:#fff;color:#141818}
.bulk .btn{background:#fff;color:#141818;border-color:#fff}
.bulk .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.count-line{font-size:13px;color:var(--muted);margin:2px 0 10px}

/* forms */
.form .fs{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px 24px;margin-bottom:16px}
.form .fs h3{margin:0 0 14px;font-size:16.5px;font-weight:600;display:flex;align-items:center;gap:10px}
.form .fs h3 .n{width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px 18px}
.f{display:flex;flex-direction:column;gap:5px}
.f.wide{grid-column:1/-1}
.f label{font-size:13px;font-weight:600;color:var(--ink-2)}
.f label em{color:var(--red);font-style:normal}
.f input,.f select,.f textarea{padding:9px 12px;border:1px solid var(--line);border-radius:4px;background:var(--field);width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--red);outline:none}
.f textarea{min-height:76px;resize:vertical}
.f small{color:var(--muted);font-size:12px}
.cat-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cp{position:relative;cursor:pointer}
.cp input{position:absolute;opacity:0}
.cp span{display:block;border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;border-top-width:4px;background:var(--field)}
.cp-T span{border-top-color:var(--tech)} .cp-S span{border-top-color:var(--soft)} .cp-M span{border-top-color:var(--mgr)}
.cp b{display:block;font-weight:600}
.cp small{color:var(--muted)}
.cp input:checked+span{border-color:var(--red);background:var(--red-t)}
.cp-T input:checked+span{border-top-color:var(--tech)} .cp-S input:checked+span{border-top-color:var(--soft)} .cp-M input:checked+span{border-top-color:var(--mgr)}
.cp input:focus-visible+span{outline:2px solid var(--red)}
.rng .row{display:flex;align-items:center;gap:10px}
.rng input{flex:1;accent-color:var(--red);padding:0;border:0;background:none}
.rng output{font-weight:700;width:20px;text-align:center}
.rng .scale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.scorebox{border:1px dashed var(--red);background:var(--red-t);border-radius:6px;padding:12px 16px;display:flex;align-items:center;gap:14px}
.scorebox b{font-size:32px;line-height:1;font-weight:700}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--page);padding:14px 0;border-top:1px solid var(--line);z-index:5}

/* dashboard lists */
.olist{display:flex;flex-direction:column;gap:12px}
.orow{display:grid;grid-template-columns:minmax(150px,1.2fr) 2fr auto;gap:12px;align-items:center;font-size:13.5px}
.otrack{display:flex;height:10px;background:var(--line-2);overflow:hidden;border-radius:2px}
.otrack i{display:block;height:100%;background:var(--red)}
.missing{display:flex;flex-wrap:wrap;gap:8px}
.missing span{background:var(--danger-t);color:var(--danger);padding:4px 12px;border-radius:4px;font-size:13px;font-weight:600}
.toplist{margin:0;padding:0;list-style:none}
.toplist li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:11px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.toplist li:last-child{border-bottom:0}
.toplist li b{font-weight:600}
.toplist small{color:var(--muted)}

/* month load */
.load{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;align-items:end;height:200px;padding-top:10px}
.load .col{display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.load .col i{display:block;width:100%}
.load .col i.T{background:var(--tech)} .load .col i.S{background:var(--soft)} .load .col i.M{background:var(--mgr)}
.load .v{font-size:11.5px;text-align:center;color:var(--muted);margin-bottom:3px}
.load-x{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;font-size:11.5px;color:var(--muted);text-align:center;margin-top:6px;border-top:1px solid var(--line);padding-top:4px}
.legend{display:flex;gap:16px;font-size:13px;flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;margin-inline-end:6px;vertical-align:-1px;border-radius:2px}
.budget .otrack{height:14px}
.budget .otrack i.over{background:var(--danger)}

/* roadmap */
.gwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.gantt{display:grid;grid-template-columns:250px 1fr;min-width:1000px}
.g-head{display:grid;grid-template-columns:repeat(12,1fr);background:var(--bar);color:var(--bar-ink)}
[data-theme="light"] .g-head,[data-theme="light"] .g-corner{background:#1E2121;color:#fff}
.g-head .q{grid-column:span 3;text-align:center;font-weight:600;font-size:13px;padding:8px 0;border-inline-start:1px solid rgba(255,255,255,.12)}
.g-head .m{text-align:center;font-size:12px;padding:5px 0;border-inline-start:1px solid rgba(255,255,255,.08);border-top:1px solid rgba(255,255,255,.08);opacity:.85}
.g-corner{background:var(--bar);color:var(--bar-ink);padding:8px 14px;font-size:13px;font-weight:600;display:flex;align-items:flex-end}
.g-grp{grid-column:1/-1;background:var(--red-t);font-weight:600;padding:8px 14px;font-size:13.5px;border-bottom:1px solid var(--line);border-inline-start:4px solid var(--red)}
.g-lbl{padding:9px 14px;border-bottom:1px solid var(--line-2);font-size:13px}
.g-lbl b{display:block;font-weight:600}
.g-lbl small{color:var(--muted)}
.g-track{display:grid;grid-template-columns:repeat(12,1fr);align-items:center;border-bottom:1px solid var(--line-2);background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(100%/12 - 1px),var(--line-2) calc(100%/12 - 1px),var(--line-2) calc(100%/12));padding:6px 0}
.g-bar{height:28px;border-radius:4px;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;padding:0 10px;overflow:hidden;white-space:nowrap;margin:0 3px;cursor:pointer}
.g-bar.T{background:var(--tech)} .g-bar.S{background:var(--soft)} .g-bar.M{background:var(--mgr)}
.g-bar.done{opacity:.45}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:50}
.modal-back.show{display:flex}
.modal{background:var(--page);width:min(1000px,100%);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.modal>h3{margin:0;font-size:19px;font-weight:600;background:var(--bar);color:var(--bar-ink);padding:16px 24px;border-bottom:3px solid var(--red)}
.modal>form{padding:20px 24px}
.modal .form-actions{position:static;background:none}
.needlist{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.needlist label{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line-2);cursor:pointer;font-size:13.5px}
.needlist label:hover{background:var(--card-2)}
.calc{display:flex;gap:22px;flex-wrap:wrap;background:var(--card-2);border:1px solid var(--line);border-radius:6px;padding:12px 16px;margin-top:12px;font-size:13px;color:var(--muted)}
.calc b{display:block;font-size:19px;color:var(--ink)}

.empty{background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:56px 24px;text-align:center}
.empty h3{margin:0 0 8px;font-size:21px;font-weight:600}
.empty p{color:var(--muted);margin:0 auto 20px;max-width:58ch}
.empty .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.notice{background:var(--red-t);border:1px solid var(--line);padding:12px 16px;font-size:13.5px;margin-bottom:16px;border-radius:6px;border-inline-start:4px solid var(--red)}
.toast{position:fixed;bottom:22px;inset-inline-end:22px;background:var(--bar);color:var(--bar-ink);border:1px solid var(--line);border-inline-start:4px solid var(--red);padding:11px 18px;border-radius:6px;font-size:14px;opacity:0;transform:translateY(8px);transition:.2s;z-index:80;pointer-events:none;max-width:440px;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:none}
.toast.err{border-inline-start-color:var(--danger)}
.set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.set-grid textarea{min-height:190px;font-size:13.5px;line-height:1.8}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.data-acts{display:flex;flex-wrap:wrap;gap:10px}
.logo-prev{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo-prev .lp{border:1px dashed var(--line);border-radius:6px;padding:12px 18px;min-width:210px;min-height:80px;display:grid;place-items:center;background:var(--bar)}
.logo-prev img{max-height:60px;max-width:220px}
.langnote{font-size:12.5px;color:var(--muted);margin-top:8px}

/* ===== جدول الخطة بعرض الشاشة ===== */
.tbl.fit{overflow-x:visible}
.tbl.fit table{min-width:0;table-layout:fixed;font-size:12.5px}
.tbl.fit th{white-space:normal;line-height:1.45;vertical-align:bottom;padding:10px 8px}
.tbl.fit td{padding:10px 8px;overflow-wrap:anywhere}
.tbl.fit td.ttl{min-width:0}
.tbl.fit td.obj{max-width:none}
.tbl.fit .chip{padding:1px 8px;font-size:11.5px}

/* ===== التقويم السنوي ===== */
.poster{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 24px 18px}
.ph-top{display:grid;grid-template-columns:150px 1fr 150px;align-items:center;gap:16px;margin-bottom:16px}
.ph-top .lg-box{display:flex;align-items:center;justify-content:center;min-height:60px}
.ph-top .lg-box img{max-height:64px;max-width:150px}
.ph-top .lg-box .logo-txt{font-size:26px}
.ph-title{text-align:center}
.ph-title h2{margin:0;font-size:34px;font-weight:700;letter-spacing:.5px;line-height:1.3}
.ph-title h2 span{color:var(--red)}
.ph-title .org{font-size:16px;font-weight:600;color:var(--ink-2);margin-top:2px}
.ph-title .note{font-size:12.5px;color:var(--muted);margin-top:2px}
.ph-yr{display:grid;place-items:center}
.ph-yr b{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--red);color:#fff;font-size:24px;font-weight:700;box-shadow:0 0 0 6px var(--red-t)}
.cal{--h0:22px;--hl:20px;display:grid;grid-template-columns:118px 1fr;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:11px}
.cal-corner{background:var(--bar);border-bottom:1px solid var(--line)}
[data-theme="light"] .cal-corner,[data-theme="light"] .cal-nums{background:#1E2121;color:#fff}
.cal-nums{display:grid;grid-template-columns:repeat(31,minmax(0,1fr));background:var(--bar);color:var(--bar-ink);border-bottom:1px solid var(--line)}
.cal-nums span{text-align:center;font-weight:700;font-size:12px;padding:5px 0;border-inline-start:1px solid rgba(255,255,255,.08)}
.cal-m{display:flex;align-items:center;padding:0 12px;font-weight:700;font-size:15px;border-bottom:1px solid var(--line);background:var(--card-2);border-inline-end:3px solid var(--red)}
.cal-row{display:grid;grid-template-columns:repeat(31,minmax(0,1fr));grid-auto-rows:20px;border-bottom:1px solid var(--line);min-height:46px;position:relative}
.cal-d{grid-row:1/-1;border-inline-start:1px solid var(--line-2);text-align:center;font-size:10px;color:var(--muted);padding-top:2px;line-height:1.3;overflow:hidden;white-space:nowrap}
.cal-d.off{background:var(--card-2);color:var(--red);font-weight:600}
.cal-d.hol{background:var(--red-t);color:var(--red);font-weight:700}
.cal-d.peak{background-image:repeating-linear-gradient(135deg,transparent 0 5px,var(--soft-t) 5px 8px)}
.cal-d.out{background:var(--bg);background-image:repeating-linear-gradient(45deg,transparent 0 4px,var(--line-2) 4px 5px)}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--red)}
.cbar{z-index:1;margin:1px 1px;border-radius:3px;color:#fff;font-size:10.5px;font-weight:600;line-height:18px;padding:0 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.25);unicode-bidi:plaintext}
.cbar:hover{filter:brightness(1.12);outline:1px solid #fff}
.cbar.T{background:var(--tech)} .cbar.S{background:var(--soft)} .cbar.M{background:var(--mgr)}
.cbar.done{opacity:.5}
.cbar{text-align:center}
.clab{z-index:1;font-size:10.5px;font-weight:600;line-height:18px;margin:1px 0;padding-inline-start:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:var(--ink);border-inline-start:2px solid var(--c);background:linear-gradient(to var(--endside,left),color-mix(in srgb,var(--c) 22%,transparent),transparent)}
[dir="ltr"] .clab{--endside:right}
.cal-foot{display:grid;grid-template-columns:1.8fr 1.3fr 1fr;gap:20px;margin-top:16px;font-size:12px}
.cal-foot h4{margin:0 0 8px;font-size:13.5px;font-weight:700;color:var(--red)}
.cal-foot ul{list-style:none;margin:0;padding:0;columns:2;column-gap:16px}
.cal-foot li{break-inside:avoid;padding:2px 0;display:flex;gap:8px;align-items:center;line-height:1.5}
.cal-foot li b{font-weight:600;white-space:nowrap;min-width:108px}
.cal-key i{display:inline-block;width:22px;height:12px;border-radius:2px;flex:none}
.cal-key .k-off{background:var(--card-2);border:1px solid var(--red)}
.cal-key .k-hol{background:var(--red-t);border:1px solid var(--red)}
.cal-key .k-peak{background-image:repeating-linear-gradient(135deg,transparent 0 4px,var(--soft) 4px 6px);border:1px solid var(--line)}
.cal-key .k-done{background:var(--muted);opacity:.5}
.cal-progs li{columns:auto}
.cal-progs li i{width:14px}
.cal-note{margin-top:12px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line-2);padding-top:8px}
.tag-auto{white-space:nowrap;display:inline-block;font-size:11px;font-weight:600;background:var(--warn-t);color:var(--warn);padding:0 7px;border-radius:3px}
.rt-in{width:140px;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--field)}
.calc span button{margin-top:6px}
.sess-list{display:flex;flex-direction:column;gap:8px}
.sess{display:grid;grid-template-columns:90px 1fr 1fr 70px auto;gap:10px;align-items:center;background:var(--card-2);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.sess input{padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--field);width:100%}
.sess .g{font-weight:700}
.sess .dd{font-size:12px;color:var(--muted);text-align:center}
.sess button{background:transparent;border:1px solid var(--danger-t);color:var(--danger);border-radius:4px;padding:4px 10px;cursor:pointer}
.sess-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sess-empty{color:var(--muted);font-size:13px;padding:10px 0}
.days-pick{display:flex;gap:8px;flex-wrap:wrap}
.days-pick label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:4px;padding:5px 10px;background:var(--field);cursor:pointer;font-size:13px}

/* ===== شاشة الدخول ===== */
body.locked .hdr,body.locked main,body.locked footer.ftr,body.locked .toast{display:none!important}
.lock{display:none;position:fixed;inset:0;z-index:200;background:radial-gradient(ellipse at 30% 40%,#13202B 0%,#05080B 50%,#000 80%);color:#fff;align-items:center;justify-content:center;padding:24px}
body.locked .lock{display:flex}
.lock-card{width:min(440px,100%);background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:34px 32px 26px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lock-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.lock-top .logo-txt{color:#fff}
.lock-top img{max-height:44px;max-width:170px}
.lock h1{margin:0 0 6px;font-size:26px;font-weight:600;line-height:1.4}
.lock p{margin:0 0 22px;color:#B9C2C2;font-size:14px;line-height:1.8}
.lock label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#E2E6E6}
.pw{position:relative}
.pw input{width:100%;background:#1E2121;border:1px solid #3B4242;border-radius:4px;padding:12px 14px;padding-inline-end:46px;color:#fff;font-size:15px;letter-spacing:1px}
.pw input:focus{outline:none;border-color:var(--red)}
.pw .eye{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:#B9C2C2;cursor:pointer;width:34px;height:34px;display:grid;place-items:center}
.pw .eye svg{width:20px;height:20px;fill:currentColor}
.lock .btn-red{width:100%;margin-top:16px;padding:12px;font-size:16px}
.lock .btn-red:disabled{opacity:.5;cursor:not-allowed}
.lk-err{min-height:22px;margin-top:10px;color:#FF6B70;font-size:13px}
.lock .circ{background:#3B4242;color:#fff}
.lk-foot{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);color:#8C9696;font-size:12px;line-height:1.7}
.lock.shake .lock-card{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.sec-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px 18px}

footer.ftr{background:var(--bar);color:var(--muted);font-size:13px;padding:18px 0;margin-top:36px;border-top:1px solid var(--line-2)}
footer.ftr .in{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer.ftr b{color:var(--bar-ink)}
.print-head{display:none}

@media (max-width:1500px){.hdr .btn-out{display:none}.nav button{padding:8px 9px;font-size:14px}.hdr .in{gap:16px}}
@media (max-width:1180px){.hdr .ulink{display:none}}

td.ttl b,td.ttl .sub,.g-lbl b,.g-bar,.toplist b,.needlist b,td.obj,td.dp,.missing span{unicode-bidi:plaintext}

}
@media (max-width:980px){

  .hero .in,.cols{grid-template-columns:1fr}

  .hero p{font-size:16px}

  .filters.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}

}
@media (max-width:560px){.hdr-end .btn-red{display:none}}

function seedNeeds(d){
  const yy2=String(d.settings.year).slice(-2),today2=new Date().toISOString().slice(0,10);let changed=false;
  [['seedV1',SEED_NEEDS],['seedV2',SEED_NEEDS2]].forEach(([flag,list])=>{
    if(d.settings[flag])return;changed=true;const have=new Set(d.needs.map(n=>n.dept+'|'+n.title));
    list.forEach(r=>{if(have.has(r.dept+'|'+r.title))return;d.settings.seqN++;
      d.needs.push({id:Math.random().toString(36).slice(2,10),code:`TN${yy2}-${String(d.settings.seqN).padStart(4,'0')}`,createdAt:today2,programId:null,status:'جديد',decisionNote:'',...r})});
    d.settings[flag]=true});
  if(changed){try{localStorage.setItem(LS_KEY,JSON.stringify(d))}catch(e){}}
}

let S=load();
function load(){
  const d=defaults();
  try{
    const raw=localStorage.getItem(LS_KEY)||(typeof EMBED!=='undefined'?JSON.stringify(EMBED):null);
    if(raw){const x=JSON.parse(raw);
      Object.assign(d.settings,x.settings||{});
      d.settings.targets=Object.assign({T:40,S:35,M:25},(x.settings||{}).targets||{});
      d.settings.weights=Object.assign({align:40,impact:35,urgency:25},(x.settings||{}).weights||{});
      d.settings.rates=Object.assign({},(x.settings||{}).rates||{});
      d.needs=Array.isArray(x.needs)?x.needs:[]; d.programs=Array.isArray(x.programs)?x.programs:[];
      d.programs.forEach(p=>{if(!Array.isArray(p.sessions))p.sessions=[];
        if(p.method==='تدريب داخلي (قاعة)'&&(+p.budget||0)>0){if(!(+p.logistics>0))p.logistics=+p.budget;p.budget=0}});
      const OLD='الأفراد والثقافة (الموارد البشرية)';
      d.settings.unit=String(d.settings.unit||'').replace('قطاع الأفراد والثقافة','إدارة الموارد البشرية');
      d.settings.departments=d.settings.departments.map(x=>x===OLD?'الموارد البشرية':x);
      ['إعادة التموين','الأداء والتحول','المشتريات غير التجارية','الحد من الخسائر والامتثال'].forEach(x=>{if(!d.settings.departments.includes(x))d.settings.departments.push(x)});
      d.needs.forEach(n=>{if(n.dept===OLD)n.dept='الموارد البشرية'});
    }
  }catch(e){}
  seedNeeds(d);
  return d;
}

function mostCommon(arr){const c={};arr.filter(Boolean).forEach(x=>c[x]=(c[x]||0)+1);return Object.keys(c).sort((a,b)=>c[b]-c[a])[0]||''}

function score(n){const w=S.settings.weights;const tt=(+w.align)+(+w.impact)+(+w.urgency)||1;
  const v=((+n.align||3)*w.align+(+n.impact||3)*w.impact+(+n.urgency||3)*w.urgency)/tt;return Math.round(v/5*100)}
function band(s){return s>=75?{k:'h',t:'عالية'}:s>=55?{k:'m',t:'متوسطة'}:{k:'l',t:'منخفضة'}}
function scorePill(n){const s=score(n),b=band(s);return `<span class="score ${b.k}"><i></i>${s}<small>${te(b.t)}</small></span>`}
function share(list,valFn){const r={T:0,S:0,M:0};list.forEach(x=>{if(r[x.category]!==undefined)r[x.category]+=valFn(x)});
  const tot=r.T+r.S+r.M;const pct={T:0,S:0,M:0};
  if(tot){pct.T=Math.round(r.T/tot*100);pct.S=Math.round(r.S/tot*100);pct.M=100-pct.T-pct.S}
  return{...r,total:tot,pct}}
function deptFlag(c){const tg=S.settings.targets;const tot=c.T+c.S+c.M;
  if(!tot)return{k:'na',t:t('لم يتم الاستلام')};
  if(!c.S&&!c.M)return{k:'bad',t:t('فني فقط: يحتاج استكمال')};
  if(tot<3)return{k:'na',t:t('بيانات محدودة')};
  const miss=CK.filter(k=>!c[k]).map(k=>catName(k));
  if(miss.length)return{k:'bad',t:t('لا يوجد')+' '+miss.join(LANG==='en'?' & ':' و')};
  if(c.T/tot*100>tg.T+20)return{k:'warn',t:t('تركيز زائد على الفني')};
  return{k:'ok',t:t('متوازن')}}
function deptStats(){const m={};
  S.settings.departments.forEach(d=>m[d]={dept:d,T:0,S:0,M:0,tr:0});
  S.needs.forEach(n=>{if(!m[n.dept])m[n.dept]={dept:n.dept,T:0,S:0,M:0,tr:0};if(m[n.dept][n.category]!==undefined)m[n.dept][n.category]++;m[n.dept].tr+=(+n.trainees||0)});

function normTitle(x){return String(x||'').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')
  .split(/\s+/).map(w=>w.replace(/^(وال|بال|لل|ال)/,'')).join('').replace(/[^\u0600-\u06FFa-zA-Z0-9]/g,'').toLowerCase()}
function similarMap(){const L=S.needs.map(n=>({id:n.id,code:n.code,k:normTitle(n.title)}));const m={};
  for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const a=L[i].k,b=L[j].k;if(!a||!b)continue;
    if(a===b||(a.length>7&&b.includes(a))||(b.length>7&&a.includes(b))){(m[L[i].id]=m[L[i].id]||[]).push(L[j].code);(m[L[j].id]=m[L[j].id]||[]).push(L[i].code)}}
  return m}

const progNeeds=p=>S.needs.filter(n=>n.programId===p.id);
const progTrainees=p=>(+p.traineesOverride)>0?+p.traineesOverride:progNeeds(p).reduce((a,n)=>a+(+n.trainees||0),0);
const progGroups=p=>(+p.groups)>0?+p.groups:Math.max(1,Math.ceil(progTrainees(p)/(+S.settings.groupSize||20)));
const progTotalHours=p=>(+p.hours||0)*progGroups(p);
const progManHours=p=>(+p.hours||0)*progTrainees(p);
const daysPerGroup=p=>Math.max(1,Math.ceil((+p.hours||0)/(+S.settings.hoursPerDay||6)));
function rateOf(m){const r=(S.settings.rates||{})[m]||{};return{day:+r.day||0,head:+r.head||0}}
const progEst=p=>{const r=rateOf(p.method);return Math.round(progGroups(p)*daysPerGroup(p)*r.day+progTrainees(p)*r.head)};
const INTERNAL='تدريب داخلي (قاعة)';
const isInternal=p=>p.method===INTERNAL;
function progLogistics(p){const m=+p.logistics||0;if(m>0)return m;return isInternal(p)?(+p.budget||progEst(p)):0}
function progBudget(p){if(isInternal(p))return{v:0,src:'internal'};const m=+p.budget||0;if(m>0)return{v:m,src:'manual'};const e=progEst(p);if(e>0)return{v:e,src:'auto'};return{v:0,src:'none'}}
function budStats(P){const r={manual:0,auto:0,none:0,internal:0,total:0};P.forEach(p=>{const b=progBudget(p);r[b.src]++;r.total+=b.v});return r}
function budCell(p){const b=progBudget(p);
  if(b.src==='manual')return fmt(b.v);
  if(b.src==='auto')return `${fmt(b.v)}<div class="sub"><span class="tag-auto">${te('تقدير آلي')}</span></div>`;
  if(b.src==='internal')return '0';

function progCalc(){const f=document.getElementById('progForm');if(!f)return;
  const ids=[...f.querySelectorAll('input[name=needs]:checked')];
  const auto=ids.reduce((a,i)=>a+(+i.dataset.tr||0),0);const tr=num(f.traineesOverride.value)||auto;

  const s=+f.startMonth.value,e=+f.endMonth.value;
  const rr=rateOf(f.method.value),dpg=Math.max(1,Math.ceil(h/(+S.settings.hoursPerDay||6))),est=Math.round(g*dpg*rr.day+tr*rr.head);
  document.getElementById('progCalc').innerHTML=`<span>${te('احتياجات مرتبطة')}<b>${ids.length}</b></span><span>${te('المتدربون')}<b>${fmt(tr)}</b></span><span>${te('المجموعات')}<b>${g}</b></span><span>${te('إجمالي ساعات التنفيذ')}<b>${fmt(h*g)}</b></span><span>${te('ساعات المتدربين (Man-hours)')}<b>${fmt(h*tr)}</b></span><span>${te('التقدير الآلي للميزانية (ج.م)')}<b>${est?fmt(est):'-'}</b>${est?`<button type="button" class="btn ghost sm" onclick="document.getElementById('${f.method.value===INTERNAL?'f_logistics':'f_budget'}').value=${est}">${te('اعتمد التقدير')}</button>`:`<small>${te('حدّد الأسعار من الإعدادات')}</small>`}</span>${e<s?`<span style="color:var(--danger)"><b>${te('شهر النهاية قبل شهر البداية')}</b></span>`:''}`}
function saveProgram(e,id){e.preventDefault();const f=e.target;const fd=new FormData(f);
  const ids=fd.getAll('needs');const s=+fd.get('startMonth'),en=+fd.get('endMonth');
  if(en<s){toast(t('شهر النهاية يجب أن يكون بعد شهر البداية أو مساويًا له'),true);return}
  if(!ids.length&&!num(fd.get('traineesOverride'))){toast(t('اربط احتياجًا واحدًا على الأقل أو أدخل عدد المتدربين يدويًا'),true);return}
  const data={name:fd.get('name').trim(),category:fd.get('category'),objective:fd.get('objective'),method:fd.get('method'),provider:fd.get('provider').trim(),owner:fd.get('owner').trim(),
    hours:num(fd.get('hours')),startMonth:s,endMonth:en,budget:num(fd.get('budget')),logistics:num(fd.get('logistics')),status:fd.get('status'),evalLevel:fd.get('evalLevel'),kpi:fd.get('kpi').trim(),notes:fd.get('notes').trim(),
    traineesOverride:num(fd.get('traineesOverride'))||'',groups:num(fd.get('groups'))||''};
  readSess();const bad=MS.find(x=>!x.from||!x.to||x.to<x.from);
  if(bad){toast(t('تحقق من تواريخ الجلسات: تاريخ النهاية يجب أن يكون بعد البداية'),true);return}
  if(data.method===INTERNAL){if(!(data.logistics>0))data.logistics=data.budget;data.budget=0}
  data.sessions=MS.slice().sort((a,b)=>a.from.localeCompare(b.from));
  let p;

  else{S.settings.seqP++;p={id:uid(),code:`PR${yy()}-${String(S.settings.seqP).padStart(3,'0')}`,...data};S.programs.push(p)}
  const set=new Set(ids);
  S.needs.forEach(n=>{if(n.programId===p.id&&!set.has(n.id))n.programId=null;if(set.has(n.id)){n.programId=p.id;n.status='معتمد'}});
  save();closeModal();SEL.clear();toast(tf(id?'تم حفظ البرنامج {c}':'تم إنشاء البرنامج {c}',{c:p.code}));if(VIEW==='screen'){renderScreenTable();renderChrome()}else render()}
function delProgram(id){const p=S.programs.find(x=>x.id===id);if(!confirm(tf('حذف البرنامج {c} "{n}"؟ ستعود احتياجاته إلى قائمة المعتمد غير المدرج.',{c:p.code,n:p.name})))return;
  S.needs.forEach(n=>{if(n.programId===id)n.programId=null});S.programs=S.programs.filter(x=>x.id!==id);save();toast(tf('تم حذف {c}',{c:p.code}));render()}

let MS=[],MS_CODE='';
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const pd=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
function holSet(){const h=new Set();(S.settings.holidays||[]).forEach(x=>{for(let d=pd(x.from);iso(d)<=x.to;d.setDate(d.getDate()+1))h.add(iso(d))});return h}
function workDays(fromISO,toISO){const off=new Set(S.settings.offDays||[]);const hs=holSet();const out=[];
  for(let d=pd(fromISO);iso(d)<=toISO;d.setDate(d.getDate()+1)){if(!off.has(d.getDay())&&!hs.has(iso(d)))out.push(iso(d))}return out}
function hashCode(x){let h=0;for(const c of String(x))h=(h*31+c.charCodeAt(0))>>>0;return h}
function genSessions(hours,groups,sm,em,seed){const yr=S.settings.year;const e=Math.max(sm,em);
  const avail=workDays(iso(new Date(yr,sm,1)),iso(new Date(yr,e+1,0)));if(!avail.length)return[];
  const dpg=Math.max(1,Math.ceil((+hours||1)/(+S.settings.hoursPerDay||6)));groups=Math.max(1,groups|0);
  const step=Math.max(dpg,Math.floor(avail.length/groups));const off=step>dpg?hashCode(seed)%(step-dpg+1):0;const out=[];
  for(let g=0;g<groups;g++){let i=Math.min(g*step+off,Math.max(0,avail.length-dpg));const j=Math.min(avail.length-1,i+dpg-1);out.push({g:g+1,from:avail[i],to:avail[j]})}
  return out}
function readSess(){document.querySelectorAll('#sessList .sess').forEach((r,i)=>{if(!MS[i])return;MS[i].g=num(r.querySelector('[data-k=g]').value)||i+1;MS[i].from=r.querySelector('[data-k=from]').value;MS[i].to=r.querySelector('[data-k=to]').value})}
function drawSess(){const el=document.getElementById('sessList');if(!el)return;
  el.innerHTML=MS.length?MS.map((x,i)=>{const n=x.from&&x.to&&x.to>=x.from?workDays(x.from,x.to).length:0;
    return `<div class="sess"><span class="g">${te('مجموعة')} <input data-k="g" type="number" min="1" value="${esc(x.g||i+1)}" style="width:52px;display:inline-block;padding:3px 6px"></span>
    <label>${te('من')} <input data-k="from" type="date" value="${esc(x.from||'')}" onchange="readSess();drawSess()"></label><label>${te('إلى')} <input data-k="to" type="date" value="${esc(x.to||'')}" onchange="readSess();drawSess()"></label>
    <span class="dd">${tf('أيام العمل: {n}',{n:n})}</span><button type="button" onclick="readSess();MS.splice(${i},1);drawSess()">${te('حذف')}</button></div>`}).join('')
   :`<div class="sess-empty">${te('لا توجد جلسات بعد. أضف جلسة أو استخدم التوزيع التلقائي.')}</div>`}
function addSess(){readSess();const yr=S.settings.year;const f=document.getElementById('progForm');const sm=+f.startMonth.value;
  const last=MS.length?MS[MS.length-1].to:iso(new Date(yr,sm,1));const d=workDays(last,iso(new Date(yr,11,31)))[MS.length?1:0]||last;MS.push({g:MS.length+1,from:d,to:d});drawSess()}
function autoSess(){const f=document.getElementById('progForm');const tr=num(f.traineesOverride.value)||[...f.querySelectorAll('input[name=needs]:checked')].reduce((a,i)=>a+(+i.dataset.tr||0),0);
  const g=num(f.groups.value)||Math.max(1,Math.ceil(tr/(+S.settings.groupSize||20)));
  MS=genSessions(num(f.hours.value),g,+f.startMonth.value,+f.endMonth.value,MS_CODE||f.name.value);drawSess();toast(tf('تم توزيع {n} جلسة',{n:MS.length}))}
function autoScheduleAll(){let n=0;activeProgs().forEach(p=>{if(!p.sessions||!p.sessions.length){p.sessions=genSessions(p.hours,progGroups(p),+p.startMonth,+p.endMonth,p.code);n++}});
  save();toast(tf('تمت جدولة {n} برنامج تلقائيًا',{n}));render()}

function saveSettings(){const g=id=>document.getElementById(id).value;const lines=id=>[...new Set(g(id).split('\n').map(x=>x.trim()).filter(Boolean))];
  const tg={T:num(g('t_T')),S:num(g('t_S')),M:num(g('t_M'))};
  if(tg.T+tg.S+tg.M!==100){toast(tf('مجموع النسب المستهدفة {n}% ويجب أن يكون 100%',{n:tg.T+tg.S+tg.M}),true);return}
  const w={align:num(g('w_a')),impact:num(g('w_i')),urgency:num(g('w_u'))};
  if(w.align+w.impact+w.urgency<=0){toast(t('أدخل أوزانًا صحيحة للأولوية'),true);return}
  const L={objectives:lines('l_obj'),departments:lines('l_dep'),locations:lines('l_loc'),levels:lines('l_lvl'),methods:lines('l_mth')};
  if(Object.values(L).some(a=>!a.length)){toast(t('لا يمكن ترك أي قائمة فارغة'),true);return}
  const hol=textToRanges(g('l_hol')),pks=textToRanges(g('l_peak'));
  if(hol===null||pks===null){toast(t('صيغة العطلات أو المواسم غير صحيحة. استخدم: 2027-03-10..2027-03-12 | الاسم'),true);return}
  const heads={};document.querySelectorAll('.rt-head').forEach(i=>heads[i.dataset.m]=num(i.value));
  const rates={};document.querySelectorAll('.rt-day').forEach(i=>{const m=i.dataset.m;if(!L.methods.includes(m))return;const d=num(i.value),h=heads[m]||0;if(d||h)rates[m]={day:d,head:h}});
  Object.assign(S.settings,{rates:rates,holidays:hol,peaks:pks,hoursPerDay:Math.max(1,num(g('s_hpd'))||6),offDays:[...document.querySelectorAll('.offd:checked')].map(c=>+c.value)});
  Object.assign(S.settings,L,{year:num(g('s_year'))||2027,org:g('s_org').trim(),unit:g('s_unit').trim(),groupSize:Math.max(1,num(g('s_gs'))||20),budgetCap:num(g('s_cap')),targets:tg,weights:w});
  save();toast(t('تم حفظ الإعدادات'));render()}
function rangesToText(a){return (a||[]).map(x=>(x.from===x.to?x.from:x.from+'..'+x.to)+' | '+x.name).join('\n')}
function textToRanges(txt){const out=[];for(const line of String(txt).split('\n').map(x=>x.trim()).filter(Boolean)){
  const [dp,...nm]=line.split('|');const [f,tt]=dp.trim().split('..').map(x=>x.trim());const ok=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'');
  const to=tt||f;if(!ok(f)||!ok(to)||to<f)return null;out.push({from:f,to,name:nm.join('|').trim()||'-'})}return out}

function downloadCSV(rows,name){if(!rows.length){toast(t('لا توجد بيانات للتصدير'),true);return}const hd=Object.keys(rows[0]);
  const q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const csv='\ufeff'+[hd.map(q).join(','),...rows.map(r=>hd.map(h=>q(r[h])).join(','))].join('\r\n');
  dl(new Blob([csv],{type:'text/csv;charset=utf-8'}),name)}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

function parseCSV(x){const rows=[];let r=[],f='',q=false;x=x.replace(/^\ufeff/,'');
  for(let i=0;i<x.length;i++){const c=x[i];if(q){if(c==='"'){if(x[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&x[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=c}
  if(f||r.length){r.push(f);rows.push(r)}const hd=rows.shift()||[];return rows.filter(z=>z.some(v=>v.trim())).map(z=>{const o={};hd.forEach((h,i)=>o[h.trim()]=z[i]??'');return o})}
function importExcel(file){if(!file)return;const isCSV=/\.csv$/i.test(file.name);const rd=new FileReader();

function toDate(v){if(v instanceof Date&&!isNaN(v))return new Date(v.getTime()-v.getTimezoneOffset()*60000).toISOString().slice(0,10);
  if(typeof v==='number'&&v>20000){return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10)}return String(v||'').trim()}
function ingest(rows){let add=0,upd=0,skip=0;const clamp=v=>Math.min(5,Math.max(1,Math.round(num(v))||3));
  const cell=(r,ar)=>{const keys=[ar,EN[ar],ar.split(' (')[0],(EN[ar]||'').split(' (')[0]].filter(Boolean);for(const k of keys)if(r[k]!==undefined&&r[k]!=='')return r[k];return''};

      jobTitle:gs('jobTitle'),level:ge('level'),trainees:num(g('trainees')),gap:gs('gap'),objective:ge('objective'),kpi:gs('kpi'),
      align:clamp(g('align')),impact:clamp(g('impact')),urgency:clamp(g('urgency')),method:ge('method'),hours:num(g('hours')),quarter:ge('quarter'),cost:num(g('cost')),notes:gs('notes')};

/* ===================== كلمة السر ===================== */
const PW_KEY='zahran_tna_pwh',PW_SALT='zahran-tna|',PW_DEFAULT_HASH='c77c18eee7aa60e95e02adee488eb106dcd2394ef8595d8bb1635c49721cf0d5',UNLOCK_KEY='zahran_tna_unlocked',AL_KEY='zahran_tna_autolock';
const K256=[],H256=[];(()=>{let n=2,c=0;const isP=x=>{for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true};while(c<64){if(isP(n)){if(c<8)H256.push((Math.pow(n,1/2)%1)*4294967296|0);K256.push((Math.pow(n,1/3)%1)*4294967296|0);c++}n++}})();
function sha256(msg){const ror=(x,n)=>(x>>>n)|(x<<(32-n));const by=new TextEncoder().encode(msg);const l=by.length;const buf=new Uint8Array(((l+9+63)>>6)<<6);buf.set(by);buf[l]=0x80;
  const dv=new DataView(buf.buffer);dv.setUint32(buf.length-4,(l*8)>>>0);dv.setUint32(buf.length-8,Math.floor(l*8/4294967296));let h=H256.slice();const w=new Array(64);
  for(let i=0;i<buf.length;i+=64){for(let j=0;j<16;j++)w[j]=dv.getUint32(i+j*4)|0;
    for(let j=16;j<64;j++){const a=w[j-15],b=w[j-2];w[j]=(w[j-16]+(ror(a,7)^ror(a,18)^(a>>>3))+w[j-7]+(ror(b,17)^ror(b,19)^(b>>>10)))|0}
    let [a,b,c,d,e,f,g,k]=h;
    for(let j=0;j<64;j++){const t1=(k+(ror(e,6)^ror(e,11)^ror(e,25))+((e&f)^(~e&g))+K256[j]+w[j])|0;const t2=((ror(a,2)^ror(a,13)^ror(a,22))+((a&b)^(a&c)^(b&c)))|0;k=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
    h=[h[0]+a,h[1]+b,h[2]+c,h[3]+d,h[4]+e,h[5]+f,h[6]+g,h[7]+k].map(x=>x|0)}
  return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}
const pwHash=p=>sha256(PW_SALT+p);
function storedHash(){try{return localStorage.getItem(PW_KEY)||PW_DEFAULT_HASH}catch(e){return PW_DEFAULT_HASH}}
const isDefaultPw=()=>storedHash()===PW_DEFAULT_HASH;
let FAILS=0,BLOCK_UNTIL=0,LAST_ACT=Date.now();
function autoLockMin(){try{const v=localStorage.getItem(AL_KEY);return v===null?15:+v}catch(e){return 15}}

  document.getElementById('lkEye').title=t('إظهار / إخفاء كلمة السر');document.getElementById('lkEye').setAttribute('aria-label',t('إظهار / إخفاء كلمة السر'));
  document.getElementById('lkBtn').textContent=t('دخول');
  document.getElementById('lkFoot').textContent=t(S.settings.unit)+' | '+t('يُقفل النظام تلقائيًا بعد فترة عدم استخدام، ويطلب كلمة السر عند كل فتح للملف.');}
function lockNow(){try{sessionStorage.removeItem(UNLOCK_KEY)}catch(e){}closeModal();document.body.classList.add('locked');renderLock();const i=document.getElementById('lkPw');i.value='';i.type='password';document.getElementById('lkErr').textContent='';setTimeout(()=>i.focus(),50)}
function unlockUI(){try{sessionStorage.setItem(UNLOCK_KEY,'1')}catch(e){}document.body.classList.remove('locked');LAST_ACT=Date.now();render()}
function tryUnlock(){const err=document.getElementById('lkErr');const btn=document.getElementById('lkBtn');
  if(Date.now()<BLOCK_UNTIL){err.textContent=tf('محاولات كثيرة خاطئة. حاول مرة أخرى بعد {s} ثانية.',{s:Math.ceil((BLOCK_UNTIL-Date.now())/1000)});return}
  const v=document.getElementById('lkPw').value;
  if(pwHash(v)===storedHash()){FAILS=0;unlockUI();if(isDefaultPw())setTimeout(()=>toast(t('أنت تستخدم كلمة السر الافتراضية. غيّرها من الإعدادات > الأمان.'),true),300);return}
  FAILS++;const lk=document.getElementById('lock');lk.classList.remove('shake');void lk.offsetWidth;lk.classList.add('shake');
  if(FAILS>=5){BLOCK_UNTIL=Date.now()+30000;FAILS=0;btn.disabled=true;setTimeout(()=>{btn.disabled=false;err.textContent=''},30000);err.textContent=tf('محاولات كثيرة خاطئة. حاول مرة أخرى بعد {s} ثانية.',{s:30})}
  else err.textContent=tf('كلمة السر غير صحيحة. المحاولات المتبقية: {n}',{n:5-FAILS});
  document.getElementById('lkPw').select()}
['mousemove','keydown','click','scroll','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{LAST_ACT=Date.now()},{passive:true}));
setInterval(()=>{const m=autoLockMin();if(m>0&&!document.body.classList.contains('locked')&&Date.now()-LAST_ACT>m*60000)lockNow()},20000);
function changePw(){const g=id=>document.getElementById(id).value;const cur=g('pw_cur'),n1=g('pw_new'),n2=g('pw_new2');
  if(pwHash(cur)!==storedHash()){toast(t('كلمة السر الحالية غير صحيحة'),true);return}
  if(n1.length<6){toast(t('كلمة السر الجديدة يجب ألا تقل عن 6 أحرف'),true);return}
  if(n1!==n2){toast(t('كلمة السر الجديدة وتأكيدها غير متطابقين'),true);return}
  try{localStorage.setItem(PW_KEY,pwHash(n1))}catch(e){toast(t('تعذر حفظ كلمة السر على هذا المتصفح'),true);return}
  ['pw_cur','pw_new','pw_new2'].forEach(id=>document.getElementById(id).value='');toast(t('تم تغيير كلمة السر'));render()}

    else toast('كلمة السر غير صحيحة',true)}catch(e){toast('تعذر الاتصال بالخادم',true)}
  syncUI()}
if(syncOn()){syncUI();syncPull();setInterval(syncPull,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncPull()})}
applyLangTheme();render();
let UNL=false;try{UNL=sessionStorage.getItem(UNLOCK_KEY)==='1'}catch(e){}
if(!UNL)lockNow();
</script>
